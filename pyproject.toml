[project]
name = "retrack-workspace"
version = "0.0.0"
requires-python = ">=3.12"
# Vercel installs the root project's dependencies from the workspace lock, so the
# deployed server must be listed here (see docs/architecture.md, Runtime).
dependencies = ["retrack-server"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "server"]

[tool.uv.sources]
retrack = { workspace = true }
retrack-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "retrack",
    "retrack-server",
    "uvicorn>=0.54.0",
    "langgraph>=1.2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/tests", "server/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["retrack", "retrack_server"]
