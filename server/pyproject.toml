[project]
name = "retrack-server"
version = "0.0.1"
description = "Retrack backend: ingest, recall, workers, pipelines"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "langgraph>=1.2.16",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
retrack-admin = "retrack_server.admin:main"

[tool.vercel]
entrypoint = "main:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
